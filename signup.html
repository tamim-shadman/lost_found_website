<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="images/logo.png">
    <title>Create Citizen Account — Lost & Found Bangladesh</title>
    <meta name="description" content="Join Lost and Found Bangladesh to help reunite missing belongings and missing persons with their families.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
      .pw-strength-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--border-subtle);
        overflow: hidden;
        margin-top: 6px;
      }
      .pw-strength-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease, background-color 0.3s ease;
      }
    </style>
</head>
<body class="auth-page">
    <!-- Ambient Floating Orbs & Atmospheric Mesh -->
    <div class="ambient-mesh-canvas" aria-hidden="true">
      <div class="ambient-orb ambient-orb-emerald"></div>
      <div class="ambient-orb ambient-orb-indigo"></div>
      <div class="ambient-orb ambient-orb-rose"></div>
    </div>

    <!-- Quick back button -->
    <div class="position-absolute top-0 start-0 p-3 z-3">
      <a href="index.html" class="btn btn-ghost btn-sm text-secondary d-flex align-items-center gap-2 border border-subtle glass-subtle rounded-pill px-3">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card glass-panel animate-fade-in wide-card card-interactive-glow">
            <div class="auth-header text-center">
                <a href="index.html" class="brand-badge mb-3 text-decoration-none">
                    <span class="badge-dot"></span>
                    <span class="brand-text">Lost &amp; Found Bangladesh</span>
                </a>
                <h1 class="auth-title">Create Citizen Account</h1>
                <p class="auth-subtitle">Join thousands of citizens across Bangladesh restoring lost memories, valuables, and public trust.</p>
            </div>

            <div id="signupAlert" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="signupAlertMsg">Registration error</span>
            </div>

            <form id="signupForm" class="auth-form" onsubmit="handleSignupSubmit(event)">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="fnameInput" class="form-label">First Name</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person icon"></i>
                            <input type="text" class="form-control" id="fnameInput" name="first_name" placeholder="Tamim" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="lnameInput" class="form-label">Last Name</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person icon"></i>
                            <input type="text" class="form-control" id="lnameInput" name="last_name" placeholder="Shadman" required>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="emailInput" class="form-label">Email Address</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-envelope icon"></i>
                            <input type="email" class="form-control" id="emailInput" name="email" placeholder="user@gmail.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="phoneInput" class="form-label">Contact Number (BD)</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-telephone icon"></i>
                            <input type="tel" class="form-control" id="phoneInput" name="phone" placeholder="017XXXXXXXX" required autocomplete="tel">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="passwordInput" class="form-label">Password</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-lock icon"></i>
                            <input type="password" class="form-control" id="passwordInput" name="password" placeholder="At least 8 chars" required minlength="8" autocomplete="new-password" oninput="checkStrength(this.value)">
                        </div>
                        <div class="pw-strength-bar">
                          <div class="pw-strength-fill" id="strengthFill"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-shield-lock icon"></i>
                            <input type="password" class="form-control" id="confirmPasswordInput" name="confirm_password" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                    <label class="form-check-label text-secondary small" for="termsCheck">
                        I agree to the <a href="#" class="text-emerald text-decoration-none" onclick="alert('Community Guidelines: Zero tolerance for fraud, scamming, or false missing persons reports.'); return false;">Community Guidelines</a> and verify that all notices I file represent legitimate items.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block w-100 py-3 shadow-lg" id="signupSubmitBtn">
                    <span id="btnText">Create Citizen Account</span>
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="auth-footer text-center mt-4 pt-3 border-top border-subtle">
                <span class="text-secondary small">Already have an account? </span>
                <a href="login.html" class="auth-link text-emerald fw-semibold small">Sign In</a>
            </div>
        </div>
    </div>

    <script>
      function checkStrength(val) {
        const fill = document.getElementById('strengthFill');
        if (!val) {
          fill.style.width = '0%';
          return;
        }
        let score = 0;
        if (val.length >= 8) score += 30;
        if (/[A-Z]/.test(val)) score += 25;
        if (/[0-9]/.test(val)) score += 25;
        if (/[^A-Za-z0-9]/.test(val)) score += 20;

        fill.style.width = score + '%';
        if (score < 50) {
          fill.style.backgroundColor = 'var(--color-rose-500)';
        } else if (score < 80) {
          fill.style.backgroundColor = 'var(--color-amber-500)';
        } else {
          fill.style.backgroundColor = 'var(--color-emerald-500)';
        }
      }

      function handleSignupSubmit(e) {
        e.preventDefault();
        const fname = document.getElementById('fnameInput').value.trim();
        const lname = document.getElementById('lnameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        const pw = document.getElementById('passwordInput').value;
        const cpw = document.getElementById('confirmPasswordInput').value;
        const alertBox = document.getElementById('signupAlert');
        const submitBtn = document.getElementById('signupSubmitBtn');

        if (pw !== cpw) {
          if (window.playCivicSound) playCivicSound('alert');
          alertBox.className = 'alert alert-danger d-flex align-items-center mb-3';
          document.getElementById('signupAlertMsg').textContent = 'Passwords do not match. Please verify.';
          return;
        }

        submitBtn.disabled = true;
        document.getElementById('btnText').textContent = 'Creating Account...';

        fetch('api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            first_name: fname,
            last_name: lname,
            email: email,
            phone: phone,
            password: pw
          })
        })
        .then(r => r.json().then(data => ({ status: r.status, data })))
        .then(({ status, data }) => {
          if (data.success) {
            if (window.playCivicSound) playCivicSound('success');
            if (window.showToast) showToast('Account created! Welcome to Lost & Found BD.', 'success', 'Registration Verified');
            alertBox.className = 'alert alert-success d-flex align-items-center mb-3';
            document.getElementById('signupAlertMsg').textContent = 'Account created successfully! Redirecting to your dashboard...';
            setTimeout(() => {
              window.location.href = 'User_profile.html';
            }, 800);
          } else {
            if (window.playCivicSound) playCivicSound('alert');
            alertBox.className = 'alert alert-danger d-flex align-items-center mb-3';
            document.getElementById('signupAlertMsg').textContent = data.error || 'Registration failed.';
            submitBtn.disabled = false;
            document.getElementById('btnText').textContent = 'Create Citizen Account';
          }
        })
        .catch(() => {
          window.location.href = 'User_profile.html';
        });
      }
    </script>
    <script src="components/command-palette.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="images/logo.png">
    <title>Create Account — Lost & Found Bangladesh</title>
    <meta name="description" content="Join Lost and Found Bangladesh to help reunite missing belongings and missing persons with their families.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card glass-panel animate-fade-in wide-card">
            <div class="auth-header text-center">
                <a href="index.html" class="brand-badge mb-3">
                    <span class="badge-dot"></span>
                    <span class="brand-text">Lost & Found Bangladesh</span>
                </a>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join thousands of citizens across Bangladesh restoring lost memories and items.</p>
            </div>

            <div id="signupAlert" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="signupAlertMsg">Registration error</span>
            </div>

            <form id="signupForm" class="auth-form" onsubmit="handleSignupSubmit(event)">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="fnameInput" class="form-label">First Name</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person icon"></i>
                            <input type="text" class="form-control" id="fnameInput" name="first_name" placeholder="Tamim" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="lnameInput" class="form-label">Last Name</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person icon"></i>
                            <input type="text" class="form-control" id="lnameInput" name="last_name" placeholder="Shadman" required>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="emailInput" class="form-label">Email Address</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-envelope icon"></i>
                            <input type="email" class="form-control" id="emailInput" name="email" placeholder="user@gmail.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="phoneInput" class="form-label">Contact Number (BD)</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-telephone icon"></i>
                            <input type="tel" class="form-control" id="phoneInput" name="phone" placeholder="017XXXXXXXX" required autocomplete="tel">
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="passwordInput" class="form-label">Password</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-lock icon"></i>
                            <input type="password" class="form-control" id="passwordInput" name="password" placeholder="At least 8 chars" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-shield-lock icon"></i>
                            <input type="password" class="form-control" id="confirmPasswordInput" name="confirm_password" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                    <label class="form-check-label text-secondary small" for="termsCheck">
                        I agree to the <a href="#" class="text-emerald text-decoration-none">Community Guidelines</a> and verify that all lost/found notices I file represent legitimate items.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block w-100 py-3" id="signupSubmitBtn">
                    <span id="btnText">Create Citizen Account</span>
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="auth-footer text-center mt-4 pt-3 border-top border-subtle">
                <span class="text-secondary small">Already have an account? </span>
                <a href="login.html" class="auth-link text-emerald fw-semibold small">Sign In</a>
            </div>
        </div>
    </div>

    <script>
      function handleSignupSubmit(e) {
        e.preventDefault();
        const fname = document.getElementById('fnameInput').value.trim();
        const lname = document.getElementById('lnameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        const pw = document.getElementById('passwordInput').value;
        const cpw = document.getElementById('confirmPasswordInput').value;
        const alertBox = document.getElementById('signupAlert');
        const submitBtn = document.getElementById('signupSubmitBtn');

        if (pw !== cpw) {
          alertBox.className = 'alert alert-danger d-flex align-items-center mb-3';
          document.getElementById('signupAlertMsg').textContent = 'Passwords do not match. Please verify.';
          return;
        }

        submitBtn.disabled = true;
        document.getElementById('btnText').textContent = 'Creating Account...';

        fetch('api/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'register',
            first_name: fname,
            last_name: lname,
            email: email,
            phone: phone,
            password: pw
          })
        })
        .then(r => r.json().then(data => ({ status: r.status, data })))
        .then(({ status, data }) => {
          if (data.success) {
            alertBox.className = 'alert alert-success d-flex align-items-center mb-3';
            document.getElementById('signupAlertMsg').textContent = 'Account created successfully! Redirecting to your dashboard...';
            setTimeout(() => {
              window.location.href = 'User_profile.html';
            }, 800);
          } else {
            alertBox.className = 'alert alert-danger d-flex align-items-center mb-3';
            document.getElementById('signupAlertMsg').textContent = data.error || 'Registration failed.';
            submitBtn.disabled = false;
            document.getElementById('btnText').textContent = 'Create Citizen Account';
          }
        })
        .catch(() => {
          window.location.href = 'User_profile.html';
        });
      }
    </script>
</body>
</html>
